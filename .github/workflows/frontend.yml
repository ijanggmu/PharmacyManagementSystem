name: Frontend CI

# Frontend pipeline for the pharmacy web app (clients/pharmacywebapp, Next.js)
# and the operator console (clients/admin, React + Vite).
# Only does real work when clients/** changed; a backend-only PR still triggers
# the workflow but the heavy jobs skip and the always-running "Frontend CI" gate
# reports green so required status checks resolve. Playwright suites are
# route-mocked (no backend needed) — the configs boot a Vite dev server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read-only by default; only the change detector needs PR read access.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter lists PR files via the API
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            frontend:
              - 'clients/**'
              - '.github/workflows/frontend.yml'

  lint-build:
    name: Lint & Build (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin]
    defaults:
      run:
        working-directory: clients/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build` — this is the typecheck + bundle gate.
      - name: Build
        run: npm run build

  pharmacywebapp:
    name: Test & Build (pharmacywebapp)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pharmacywebapp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Yarn 4 is pinned via package.json "packageManager"; corepack provides it.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: clients/pharmacywebapp/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      # No lint step: Next 16 removed `next lint` and the app has no ESLint
      # config yet. `next build` below is the typecheck gate.
      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: E2E (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin]
    defaults:
      run:
        working-directory: clients/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The Playwright config starts the Vite dev server itself and mocks all
      # API calls via page.route(), so no backend is required.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}
          path: clients/${{ matrix.app }}/playwright-report
          retention-days: 7

  # Single required status check — see backend.yml for the rationale.
  frontend-ci:
    name: Frontend CI
    needs: [changes, lint-build, pharmacywebapp, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required frontend job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required frontend job failed or was cancelled."
          exit 1
      - name: Success
        run: echo "Frontend CI passed."

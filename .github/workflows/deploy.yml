name: Deploy

# Builds the four app images, pushes them to GHCR, then rolls the VPS forward
# over SSH (docker compose pull + up). Pull requests only build (nothing is
# pushed or deployed) so a broken Dockerfile is caught before merge.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   Variables  VPS_HOST, VPS_USER, DEPLOY_PATH (default /opt/pharmacy)
#              IMAGE_PLATFORMS (default linux/amd64; linux/arm64 for Oracle Ampere)
#              PHARMACY_APP_URL, PHARMACY_TENANT_ROOT_DOMAIN, GOOGLE_CLIENT_ID,
#              SUPPORT_EMAIL, SUPPORT_PHONE  (baked into the web app at build time)
#   Secrets    VPS_SSH_KEY (private key whose public half is in ~VPS_USER/.ssh/authorized_keys)
# The deploy job is skipped until VPS_HOST is set. Runtime secrets stay in
# $DEPLOY_PATH/.env on the server (see deploy/docker/.env.example).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: read-only by default; only the image build job may push to GHCR.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GHCR (skipped on pull requests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: src/Host/FSH.Starter.Api/Dockerfile
          - image: migrator
            context: .
            dockerfile: src/Host/FSH.Starter.DbMigrator/Dockerfile
          - image: admin
            context: clients/admin
            dockerfile: clients/admin/Dockerfile
          - image: web
            context: clients/pharmacywebapp
            dockerfile: clients/pharmacywebapp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pharmacy/${{ matrix.image }}" >> "$GITHUB_ENV"

      # Only the admin/web images need emulation for arm64; the .NET images cross-compile.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.PHARMACY_APP_URL }}
            NEXT_PUBLIC_TENANT_ROOT_DOMAIN=${{ vars.PHARMACY_TENANT_ROOT_DOMAIN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ vars.SUPPORT_PHONE }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Boots the real compose storage services (RustFS + bucket init) and round-trips
  # an object, so a broken data-plane image or credential wiring fails before deploy.
  storage-smoke:
    name: Compose storage smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/docker
    env:
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key-123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start RustFS and create the bucket
        run: docker compose --env-file /dev/null -f docker-compose.yml up --wait --no-deps rustfs && docker compose --env-file /dev/null -f docker-compose.yml up --no-deps --exit-code-from s3-init s3-init
        env:
          # Satisfy the compose file's other required variables; those services are not started.
          POSTGRES_PASSWORD: unused
          REDIS_PASSWORD: unused
          JWT_SIGNING_KEY: unused
          SEED_ADMIN_PASSWORD: unused
          HANGFIRE_USERNAME: unused
          HANGFIRE_PASSWORD: unused
          FSH_API_URL: http://unused
          FSH_ADMIN_URL: http://unused
          PHARMACY_APP_URL: http://unused
      - name: Round-trip an object
        run: |
          docker run --rm --network fsh_default \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" -e AWS_DEFAULT_REGION=us-east-1 \
            --entrypoint sh amazon/aws-cli:2.37.12 -c '
              echo smoke > /tmp/o && aws --endpoint-url http://rustfs:9000 s3 cp /tmp/o s3://fsh/smoke.txt &&
              test "$(aws --endpoint-url http://rustfs:9000 s3 cp s3://fsh/smoke.txt -)" = smoke'

  deploy:
    name: Deploy to VPS
    needs: [build, storage-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read   # the VPS pulls the images with this job's GITHUB_TOKEN
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pharmacy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ship only the compose bundle; the server never needs the source tree or a deploy key.
      - name: Copy compose bundle
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker/docker-compose.yml,deploy/docker/docker-compose.nginx-proxy.yml,deploy/docker/Caddyfile,deploy/docker/postgres-init,deploy/docker/scripts
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 2

      # The rollout itself lives in deploy/docker/scripts/deploy.sh (shipped above), so it can be linted,
      # read in one place and re-run by hand on the server. In order, it:
      #   1. records the sha of the release running now (.deployed-tag, else the fsh-api container's image tag);
      #   2. pulls the new images (failure = stop, nothing running was touched);
      #   3. dumps the database with scripts/backup.sh (label "predeploy", newest 5 kept, optional off-site
      #      copy) — a failed backup also stops the deploy before migrations run;
      #   4. `docker compose up` (migrator first), then polls API /health/ready (or /health/live when the API
      #      was already not ready before this deploy) and the web app until healthy or DEPLOY_HEALTH_TIMEOUT;
      #   5. on failure starts the previous sha-tagged release again and exits non-zero, failing this job.
      # With none of the new optional .env keys set it does what the old inline script did, plus the backup
      # and the health gate.
      - name: Back up, roll out, health-check (rolls back on failure)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_OWNER,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          # Backup + pull + up + health wait (and a possible rollback) can outlast the action's 10 min default.
          command_timeout: 40m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env || { echo "missing $DEPLOY_PATH/.env (copy .env.example from the repo)"; exit 1; }
            chmod +x scripts/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Log out of GHCR however the rollout ends (the token is short-lived, but don't leave it on disk).
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            # Shell env overrides IMAGE_PREFIX/IMAGE_TAG in .env; COMPOSE_PROFILES in .env (e.g. caddy) still applies.
            export IMAGE_PREFIX="ghcr.io/$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/pharmacy"
            export IMAGE_TAG
            sh scripts/deploy.sh

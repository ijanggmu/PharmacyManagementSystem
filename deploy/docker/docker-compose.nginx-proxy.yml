# Overlay for hosts that already run nginx-proxy (jwilder/nginxproxy) with
# acme-companion: the web app and API join the proxy's Docker network and
# advertise their hostnames, and the companion issues Let's Encrypt certs.
#
# Enable it from .env (compose reads COMPOSE_FILE there):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.nginx-proxy.yml
#   PROXY_NETWORK=<network nginx-proxy is attached to>
#   PHARMACY_APP_HOST=app.example.com
#   FSH_API_HOST=api.example.com
#   LETSENCRYPT_EMAIL=you@example.com
#
# Per-host nginx tweaks (upload size, SSE timeouts) go in nginx-proxy's
# vhost.d/<hostname> file; see README.md.

services:
  api:
    networks: [default, proxy]
    environment:
      VIRTUAL_HOST: ${FSH_API_HOST:?FSH_API_HOST is required}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${FSH_API_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}

  pharmacywebapp:
    networks: [default, proxy]
    environment:
      VIRTUAL_HOST: ${PHARMACY_APP_HOST:?PHARMACY_APP_HOST is required}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${PHARMACY_APP_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}

networks:
  proxy:
    name: ${PROXY_NETWORK:?PROXY_NETWORK is required}
    external: true
